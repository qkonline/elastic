# Elastic's worker: notifications, and accounts that sync the plan across devices. Deploy
# with `npx wrangler deploy` from this folder (Wrangler needs Node 22+). The private key is a
# secret: `npx wrangler secret put VAPID_PRIVATE_KEY`. Database changes go in migrations/ and are
# applied with `npx wrangler d1 migrations apply elastic-day --remote`.
name = "elastic-day-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# The app lives at elastic.kaiserkhan.com, served by this Worker with its API under /api (since
# 23 Oct 2026; before, the app was at kaiserkhan.com/planner/ on Hostinger). workers.dev stays
# on for app versions from before, which call the API there at the root.
routes = [{ pattern = "elastic.kaiserkhan.com", custom_domain = true }]

# The built app (`npm run build` first). /api/* always reaches the Worker; any other path that
# isn't one of the app's files does too (the old root API paths on workers.dev).
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
VAPID_PUBLIC_KEY = "BIUrkbS-EnZQ2hLavgQmshFuBLt_mD2aD4l9VLtB5mEhCQjF9CQDBRRWlEMcdkkdtiVz--i3rZocPSV3abVpycY"
VAPID_SUBJECT = "https://elastic.kaiserkhan.com/"
# www.kaiserkhan.com serves the same files; the app moves itself to kaiserkhan.com, but copies
# already opened on www still need to reach the Worker.
ALLOWED_ORIGINS = "https://elastic.kaiserkhan.com,https://kaiserkhan.com,https://www.kaiserkhan.com,http://localhost:4173,http://localhost:8787"
EMAIL_FROM = "Elastic <elastic@kaiserkhan.com>"
# Passkeys belong to kaiserkhan.com, so the ones made at kaiserkhan.com/planner/ keep working here.
RP_ID = "kaiserkhan.com"

[[durable_objects.bindings]]
name = "TIMERS"
class_name = "Timer"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Timer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

# Requests per network a minute on the routes anyone can call (booking pushes, starting a passkey
# sign-in): Cloudflare's rate limiting, counted where the request lands, nothing stored.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "elastic-day"
database_id = "a972726d-b3bb-4f2b-98ed-ac33fdf859ad"
migrations_dir = "migrations"

# Email (sign-in codes) goes through Resend, like Boardo's, from the kaiserkhan.com domain verified
# there. The key is a secret: `npx wrangler secret put RESEND_API_KEY` (run it in a terminal, it
# asks for the key). For `wrangler dev`, put DEV_MAIL=1 in .dev.vars to keep codes at /dev/mail.

# Boardo's Worker, for the account's link to it (src/boardo.ts). Boardo calls back through its
# own binding to the BoardoHooks entrypoint when someone's cards change.
[[services]]
binding = "BOARDO"
service = "boardo-api"
entrypoint = "ElasticLink"

[observability]
enabled = true
